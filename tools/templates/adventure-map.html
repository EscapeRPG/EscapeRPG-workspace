<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte des scènes</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #111827; color: #e5e7eb; font: 15px system-ui, sans-serif; }
header { padding: 20px 24px; border-bottom: 1px solid #374151; }
h1 { margin: 0 0 8px; font-size: 24px; }
p { line-height: 1.5; }
header p { margin: 8px 0; max-width: 1100px; color: #cbd5e1; }
.toolbar { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 16px; }
input, select, button { font: inherit; color: inherit; background: #1f2937; border: 1px solid #64748b; border-radius: 6px; padding: 8px; }
input[type="range"] { width: 130px; padding: 0; vertical-align: middle; }
button { cursor: pointer; }
button:hover { background: #374151; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; height: calc(100vh - 235px); min-height: 400px; }
#viewport { overflow: auto; touch-action: pan-x pan-y; cursor: grab; background-image: radial-gradient(#374151 1px, transparent 1px); background-size: 20px 20px; }
#viewport:active { cursor: grabbing; }
#viewport:focus-visible { outline: 2px solid #93c5fd; outline-offset: -2px; }
aside { overflow: auto; padding: 20px; background: #172033; border-left: 1px solid #374151; }
aside h2 { font-size: 20px; margin-top: 0; }
aside h3 { font-size: 15px; color: #93c5fd; margin-top: 24px; }
aside li { margin-bottom: 8px; overflow-wrap: anywhere; }
aside ul { padding-left: 20px; }
aside pre { padding: 12px; overflow: auto; background: #111827; font-size: 12px; }
aside code { overflow-wrap: anywhere; }
.legend { font-size: 13px; color: #cbd5e1; }
.entry-color { color: #6ee7b7; } .partial-color { color: #fbbf24; } .missing-color { color: #f87171; }
svg { display: block; }
.edge path { fill: none; stroke: #64748b; stroke-width: 1.5; }
.edge text { fill: #cbd5e1; font-size: 11px; paint-order: stroke; stroke: #111827; stroke-width: 4px; stroke-linejoin: round; }
.edge.active path { stroke: #93c5fd; stroke-width: 3; }
.node { cursor: pointer; }
.node rect { fill: #1f2937; stroke: #94a3b8; stroke-width: 2; rx: 10; }
.node text { fill: #f8fafc; font-size: 14px; pointer-events: none; }
.node .label { fill: #cbd5e1; font-size: 12px; }
.node.partial rect { stroke-dasharray: 6 3; stroke: #fbbf24; }
.node.entry rect { stroke: #6ee7b7; }
.node.missing rect { stroke: #f87171; fill: #451a23; }
.node.selected rect, .node:focus rect { stroke: #93c5fd; stroke-width: 4; }
.dim { opacity: .16; }
@media (max-width: 800px) { main { grid-template-columns: 1fr; height: auto; } #viewport { height: 60vh; } aside { max-height: 55vh; border-left: 0; } }
</style>
<header>
  <h1 id="title">Carte des scènes</h1>
  <p id="notice"></p>
  <p class="legend"><span class="entry-color">● Entrée</span> · <span class="partial-color">Pointillés : transitions partiellement connues</span> · <span class="missing-color">Rouge : destination absente</span> · Les changements de variante sont dans le détail.</p>
  <div class="toolbar">
    <label>Rechercher <input id="search" type="search" placeholder="Identifiant ou titre"></label>
    <label>Scène <select id="scenes"><option value="">Choisir une scène</option></select></label>
    <label>Zoom <input id="zoom" type="range" min="20" max="180" value="80"> <output id="zoom-value">80 %</output></label>
    <button id="fit" type="button">Vue d’ensemble</button>
    <span id="counts"></span>
  </div>
</header>
<main>
  <div id="viewport" tabindex="0" role="region" aria-label="Carte défilante : déplacer avec les barres de défilement ou glisser le fond"></div>
  <aside id="details" aria-live="polite"><h2>Explorer le scénario</h2><p>Cliquer sur une scène pour afficher ses fichiers, variantes et transitions. Glisser le fond pour déplacer la carte.</p></aside>
</main>
<script>
const data = /* ADVENTURE_DATA */;
const byId = new Map(data.nodes.map(node => [node.id, node]));
const viewport = document.querySelector('#viewport');
const details = document.querySelector('#details');
const select = document.querySelector('#scenes');
const search = document.querySelector('#search');
const zoom = document.querySelector('#zoom');
const svgNS = 'http://www.w3.org/2000/svg';
document.title = `${data.title} — Carte des scènes`;
document.querySelector('#title').textContent = `${data.title} — Carte des scènes`;
document.querySelector('#notice').textContent = data.notice;
document.querySelector('#counts').textContent = `${data.nodes.length} scènes · ${data.edges.length} transitions`;
const svg = document.createElementNS(svgNS, 'svg');
const makeSvg = (tag, attrs, text) => {
  const element = document.createElementNS(svgNS, tag);
  Object.entries(attrs).forEach(([name, value]) => element.setAttribute(name, value));
  if (text !== undefined) element.textContent = text;
  return element;
};
const defs = makeSvg('defs', {});
const marker = makeSvg('marker', {id: 'arrow', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse'});
marker.append(makeSvg('path', {d: 'M 0 0 L 10 5 L 0 10 z', fill: '#94a3b8'}));
defs.append(marker); svg.append(defs);
const levels = new Map([[data.entry, 0]]);
const queue = [data.entry];
for (let i = 0; i < queue.length; i++) {
  data.edges.filter(edge => edge.from === queue[i]).forEach(edge => {
    if (!levels.has(edge.to)) { levels.set(edge.to, levels.get(queue[i]) + 1); queue.push(edge.to); }
  });
}
const last = Math.max(0, ...levels.values()) + 1;
const rows = new Map();
const positions = new Map();
data.nodes.forEach(node => {
  const column = levels.get(node.id) ?? last;
  const row = rows.get(column) ?? 0;
  rows.set(column, row + 1);
  positions.set(node.id, {x: 60 + column * 330, y: 60 + row * 125});
});
const width = 100 + (Math.max(0, ...levels.values(), ...data.nodes.map(node => levels.get(node.id) ?? last)) + 1) * 330;
const height = 90 + Math.max(1, ...rows.values()) * 125;
svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
const edgeElements = [];
data.edges.forEach((edge, index) => {
  const from = positions.get(edge.from), to = positions.get(edge.to);
  if (!from || !to) return;
  const group = makeSvg('g', {class: 'edge'});
  const forward = to.x > from.x;
  const x1 = from.x + (forward ? 235 : 0), y1 = from.y + 39;
  const x2 = to.x + (forward ? 0 : 235), y2 = to.y + 39;
  const bend = forward ? (x1 + x2) / 2 : Math.min(x1, x2) - 30 - (index % 4) * 12;
  group.append(makeSvg('path', {d: `M ${x1} ${y1} C ${bend} ${y1}, ${bend} ${y2}, ${x2} ${y2}`, 'marker-end': 'url(#arrow)'}));
  const label = edge.action.length > 30 ? edge.action.slice(0, 28) + '…' : edge.action;
  group.append(makeSvg('text', {x: (x1 + x2) / 2, y: (y1 + y2) / 2 - 8, 'text-anchor': 'middle'}, label));
  group.append(makeSvg('title', {}, `${edge.action}\n${edge.note}`));
  svg.append(group); edgeElements.push({edge, group});
});
const nodeElements = new Map();
const append = (parent, tag, text) => { const el = document.createElement(tag); el.textContent = text; parent.append(el); return el; };
let selected = null;
function highlight() {
  const query = search.value.toLocaleLowerCase('fr');
  nodeElements.forEach((group, id) => {
    const node = byId.get(id);
    group.classList.toggle('dim', !!query && !`${id} ${node.label}`.toLocaleLowerCase('fr').includes(query));
    group.classList.toggle('selected', id === selected);
  });
  edgeElements.forEach(({edge, group}) => {
    const related = edge.from === selected || edge.to === selected;
    group.classList.toggle('active', related);
    group.classList.toggle('dim', !!selected && !related);
  });
}
function choose(id, center = false) {
  selected = id; select.value = id;
  const node = byId.get(id);
  details.replaceChildren();
  append(details, 'h2', node.label);
  append(details, 'code', node.id);
  append(details, 'p', node.missing ? 'Destination absente du scénario.' : node.url);
  if (node.partial) append(details, 'p', 'Transitions partiellement connues : ce handler ou cet ancien format peut ajouter des chemins calculés.');
  if (!node.reachable) append(details, 'p', 'Aucun chemin trouvé depuis l’entrée dans les seules transitions connues. Cela ne prouve pas que la scène est inaccessible.');
  append(details, 'h3', 'Fichiers');
  const files = append(details, 'ul', '');
  node.files.forEach(file => append(files, 'li', file));
  if (node.handler) append(details, 'p', `Handler : ${node.handler}`);
  append(details, 'h3', 'Variantes');
  append(details, 'p', node.variants.join(', ') || 'Aucune variante connue.');
  append(details, 'h3', 'Transitions sortantes');
  const outgoing = data.edges.filter(edge => edge.from === id);
  if (!outgoing.length) append(details, 'p', 'Aucune transition vers une autre scène déclarée.');
  outgoing.forEach(edge => {
    const button = append(details, 'button', `${edge.action} → ${edge.to}`);
    button.addEventListener('click', () => choose(edge.to, true));
    append(details, 'p', edge.note);
  });
  append(details, 'h3', 'Effets déclarés des actions (dont variantes internes)');
  append(details, 'pre', JSON.stringify(node.actions, null, 2));
  highlight();
  if (center) {
    const {x, y} = positions.get(id), scale = Number(zoom.value) / 100;
    viewport.scrollTo({left: (x + 118) * scale - viewport.clientWidth / 2, top: (y + 39) * scale - viewport.clientHeight / 2, behavior: 'smooth'});
  }
}
data.nodes.forEach(node => {
  const {x, y} = positions.get(node.id);
  const classes = ['node', node.id === data.entry ? 'entry' : '', node.partial ? 'partial' : '', node.missing ? 'missing' : ''].join(' ');
  const group = makeSvg('g', {class: classes, transform: `translate(${x}, ${y})`, tabindex: 0, role: 'button', 'aria-label': `${node.id} : ${node.label}`});
  group.append(makeSvg('rect', {width: 235, height: 78}));
  group.append(makeSvg('text', {x: 14, y: 28}, node.id));
  group.append(makeSvg('text', {x: 14, y: 51, class: 'label'}, node.label.length > 29 ? node.label.slice(0, 27) + '…' : node.label));
  group.append(makeSvg('title', {}, `${node.label}\n${node.id}`));
  group.addEventListener('click', () => choose(node.id));
  group.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); choose(node.id); } });
  svg.append(group); nodeElements.set(node.id, group);
  const option = append(select, 'option', `${node.id} — ${node.label}`); option.value = node.id;
});
viewport.append(svg);
function resize() { const scale = Number(zoom.value) / 100; svg.setAttribute('width', width * scale); svg.setAttribute('height', height * scale); document.querySelector('#zoom-value').textContent = `${zoom.value} %`; }
zoom.addEventListener('input', resize);
search.addEventListener('input', highlight);
select.addEventListener('change', () => { if (select.value) choose(select.value, true); });
document.querySelector('#fit').addEventListener('click', () => { zoom.value = String(Math.max(20, Math.min(100, Math.floor(Math.min(viewport.clientWidth / width, viewport.clientHeight / height) * 100)))); resize(); viewport.scrollTo(0, 0); });
let drag = null;
viewport.addEventListener('pointerdown', event => {
  if (event.pointerType !== 'mouse' || event.button !== 0 || event.target.closest('.node')) return;
  drag = {x: event.clientX, y: event.clientY, left: viewport.scrollLeft, top: viewport.scrollTop};
  viewport.setPointerCapture(event.pointerId); event.preventDefault();
});
viewport.addEventListener('pointermove', event => { if (drag) { viewport.scrollLeft = drag.left + drag.x - event.clientX; viewport.scrollTop = drag.top + drag.y - event.clientY; } });
viewport.addEventListener('pointerup', () => { drag = null; });
viewport.addEventListener('pointercancel', () => { drag = null; });
resize();
</script>
</html>
